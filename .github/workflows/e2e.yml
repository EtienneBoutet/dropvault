jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Create .env with throwaway credentials
        run: |
          cat > .env <<EOF
          S3_ENDPOINT=http://garage:3900
          S3_PUBLIC_ENDPOINT=http://localhost:3900
          S3_REGION=garage
          S3_BUCKET=uploads
          S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)
          S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)
          EOF

      - name: Set up Garage
        run: bash scripts/dev-setup.sh

      - name: Start app and wait until healthy
        run: docker compose up -d --build --wait remix

      - name: Run Playwright
        run: npx playwright test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
