name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E Tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.ci.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env with throwaway credentials
        run: |
          cat > .env <<EOF
          S3_ENDPOINT=http://garage:3900
          S3_PUBLIC_ENDPOINT=http://localhost:3900
          S3_REGION=garage
          S3_BUCKET=uploads
          S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)
          S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)
          EOF

      - name: Set up Garage
        run: bash scripts/dev-setup.sh

      - name: Start app and wait until healthy
        run: docker compose up -d --build --wait remix

      - name: Run Playwright
        run: npx playwright test

      - name: Tear down services
        if: always()
        run: docker compose down -v
