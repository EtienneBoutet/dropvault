services:
  garage:
    image: dxflrs/garage:v1.0.1
    ports:
      - "3900:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage/meta
      - /var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dropvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dropvault_db"]
      interval: 3s
      timeout: 5s
      retries: 20

  remix:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      garage:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "44100:44100"
    env_file: .env
    environment:
      NODE_ENV: test
      PORT: 44100
      HOST: 0.0.0.0
    command: ["npx", "tsx", "server.ts"]
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:44100').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  postgres_data:
    driver: local
